<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMP Hazırlıq Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#230A49;--dark2:#4F17A8;--violet:#7A3FE0;--aqua:#05BFE0;--aquaInk:#057A91;--tang:#FF630F;--tangInk:#B8460A;
  --lilac:#CC9BFC;--cream:#F7F4EF;--paper:#FFFFFF;--ink:#1A0837;--ink2:#4A4060;--muted:#6B6480;--rule:#ECE7DF;--rule2:#F2EEE8;
  --green:#197F10;--greenBg:#E5F4E2;--red:#C41E08;--redBg:#FCE6E2;--amber:#B85400;--amberBg:#FDEBDD;
  --violetBg:#F1EAFD;--aquaBg:#E1F6FA;--tangBg:#FFEDE2;
  --shadow:0 1px 2px rgba(35,10,73,.06),0 6px 20px rgba(35,10,73,.06);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--dark2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule)}
.top .in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--dark2),var(--dark));display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.logo:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--aqua);right:-7px;bottom:-7px;opacity:.9}
.logo b{color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;position:relative;z-index:1}
.brand .t1{font-weight:800;font-size:15px;color:var(--dark);white-space:nowrap}
.brand .t2{font-size:11px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;background:var(--rule2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink2);padding:6px 12px;border-radius:999px;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--dark);box-shadow:0 1px 3px rgba(35,10,73,.15)}
.seg.dark button.on{background:var(--dark);color:#fff}
.btn{border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:12px;cursor:pointer;background:var(--tang);color:#fff;white-space:nowrap}
.btn[disabled]{opacity:.6;cursor:wait}
.nav{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:10px 12px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button.on{color:var(--dark);border-bottom-color:var(--tang)}
.nav .n{display:inline-block;margin-left:6px;background:var(--tang);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-weight:700;vertical-align:1px}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:1.15fr 1fr 1fr}
.g2{grid-template-columns:1.4fr 1fr}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h3{margin:0 0 2px;font-size:15px;font-weight:700;color:var(--dark)}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sect h2{margin:0;font-size:18px;font-weight:800;color:var(--dark);letter-spacing:-.2px}
.sect .hint{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,#5B1FC0 0%,var(--dark2) 30%,var(--dark) 75%);color:#fff;padding:28px 30px;box-shadow:var(--shadow)}
.hero .shape{position:absolute;border-radius:50%;pointer-events:none}
.hero .s1{width:260px;height:260px;right:-60px;top:-90px;background:radial-gradient(circle,rgba(5,191,224,.55),rgba(5,191,224,0) 70%)}
.hero .s2{width:180px;height:180px;right:220px;bottom:-110px;background:radial-gradient(circle,rgba(255,99,15,.45),rgba(255,99,15,0) 70%)}
.hero .s3{width:340px;height:340px;left:-160px;bottom:-220px;border:1px solid rgba(204,155,252,.25)}
.hero-in{position:relative;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--aqua)}
.hero h1{margin:6px 0 6px;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.hero p{margin:0;color:#DCCBFA;font-size:14px;max-width:560px}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px}
.hstat .v{font-size:24px;font-weight:800;letter-spacing:-.5px}
.hstat .l{font-size:11px;color:#CDB8F5;margin-top:1px}
.bigring{position:relative;width:150px;height:150px}
.bigring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.bigring .c b{font-size:34px;font-weight:800;display:block;line-height:1}
.bigring .c span{font-size:11px;color:#CDB8F5;display:block;margin-top:4px}
.updated{font-size:11px;color:#B9A4E6;margin-top:14px}

/* ---------- roadmap ---------- */
.road{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;padding:6px 0 4px}
.road:before{content:"";position:absolute;left:8%;right:8%;top:31px;height:4px;background:var(--rule);border-radius:2px}
.road .fill{position:absolute;left:8%;top:31px;height:4px;background:linear-gradient(90deg,var(--aqua),var(--dark2));border-radius:2px}
.stop{position:relative;text-align:center;padding:0 6px;min-width:0}
.stop .dotw{width:62px;height:62px;margin:0 auto;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative;z-index:1}
.stop .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid var(--rule);color:var(--muted);background:#fff}
.stop.done .ic{background:var(--dark2);border-color:var(--dark2);color:#fff}
.stop.cur .ic{background:#fff;border-color:var(--aqua);color:var(--dark);box-shadow:0 0 0 5px rgba(5,191,224,.18)}
.stop .nm{font-weight:700;font-size:13px;margin-top:8px;color:var(--dark)}
.stop .ct{font-size:11px;color:var(--muted)}
.stop .bar{height:6px;background:var(--rule2);border-radius:3px;margin:8px auto 0;max-width:120px;overflow:hidden}
.stop .bar i{display:block;height:100%;background:var(--dark2);border-radius:3px}
.stop .who{display:flex;justify-content:center;flex-wrap:wrap;margin-top:10px;gap:0;min-height:30px}
.stop .who .av{margin-left:-6px;border:2px solid #fff}
.stop .who .av:first-child{margin-left:0}
.stop .more{font-size:11px;color:var(--muted);align-self:center;margin-left:4px}

/* ---------- avatars / rings ---------- */
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:11px;flex:none;cursor:pointer}
.av.lg{width:44px;height:44px;font-size:15px}
.ring text{font-family:Inter,system-ui,sans-serif}

/* ---------- leaderboard ---------- */
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:26px 30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule2);cursor:pointer}
.lb li:last-child{border-bottom:0}
.lb .rk{font-weight:800;color:var(--muted);text-align:center;font-size:13px}
.lb li.top1 .rk{color:var(--tang)}
.lb .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .xpbar{height:5px;background:var(--rule2);border-radius:3px;margin-top:4px;overflow:hidden}
.lb .xpbar i{display:block;height:100%;background:var(--dark2);border-radius:3px}
.lb .xp{font-weight:800;font-size:13px;color:var(--dark);text-align:right}
.lb .xp small{display:block;font-weight:600;font-size:10px;color:var(--muted)}
.flame{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--tangInk);margin-left:6px}

/* ---------- charts ---------- */
.vbars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px;border-bottom:1px solid var(--rule)}
.vbars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;cursor:default}
.vbars .b i{display:block;width:100%;max-width:34px;background:var(--dark2);border-radius:4px 4px 0 0;min-height:2px}
.vbars .b.cur i{background:var(--tang)}
.vbars .b .val{position:absolute;font-size:11px;font-weight:700;color:var(--ink);transform:translateY(-16px)}
.vlab{display:flex;gap:8px;margin-top:6px}
.vlab span{flex:1;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}
.hb{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;padding:5px 0}
.hb .lab{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{position:relative;height:12px;background:var(--rule2);border-radius:6px}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--dark2)}
.hb .tr .tg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.hb .v{font-size:12px;font-weight:700;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.doms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dom{background:var(--cream);border-radius:12px;padding:12px;text-align:center}
.dom .nm{font-weight:700;font-size:12px;color:var(--dark);margin-top:6px}
.dom .w{font-size:10px;color:var(--muted)}

/* ---------- badges ---------- */
.bdg{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;flex:none}
.bdg svg{width:16px;height:16px}
.bfeed{list-style:none;margin:0;padding:0}
.bfeed li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule2)}
.bfeed li:last-child{border-bottom:0}
.bfeed .tx{font-size:13px;min-width:0}
.bfeed .tx b{font-weight:700}
.bfeed .tx span{display:block;font-size:11px;color:var(--muted)}
.bshelf{display:flex;gap:6px;flex-wrap:wrap}
.bshelf .bdg.off{background:var(--rule2)!important;color:#BDB6C8!important}
.bdg{position:relative}
.bdg em{position:absolute;right:-5px;bottom:-5px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:#fff;color:inherit;font:800 8.5px/14px Inter,system-ui,sans-serif;font-style:normal;text-align:center;box-shadow:0 1px 3px rgba(35,10,73,.25)}
.bsec{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.bsec:first-child{margin-top:4px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.brow{display:flex;gap:10px;align-items:flex-start}
.brow .bdg{width:34px;height:34px;border-radius:11px}
.brow .bdg svg{width:18px;height:18px}
.brow.dim{opacity:.62}
.bprog{height:5px;background:var(--rule2);border-radius:3px;margin:5px 0 3px;overflow:hidden}
.bprog i{display:block;height:100%;background:var(--dark2);border-radius:3px}
.quest{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule2)}
.quest:last-of-type{border-bottom:0}
.quest .qc{width:20px;height:20px;border-radius:50%;border:2px solid var(--rule);flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.quest.ok .qc{background:var(--green);border-color:var(--green)}
.quest.ok .bprog i{background:var(--green)}
.herochip{margin-top:10px;display:inline-flex;gap:6px;align-items:center;background:var(--tangBg);color:var(--tangInk);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px}
.lbhd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbhd h3{margin:0}
.seg.sm button{padding:4px 10px;font-size:11px}
@media (max-width:720px){.seg.flow{flex-wrap:wrap;border-radius:14px}}
.act .tx .tn{color:var(--dark);font-weight:600}
.act .inp,.bar2 #q{min-width:0}
.act{list-style:none;margin:0;padding:0}
.act li.day{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dark);margin:14px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.act li.day:first-child{margin-top:2px}
.act li.row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule2);cursor:pointer;min-width:0}
.act li.row:last-child{border-bottom:0}
.act .tm{flex:none;width:52px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.act .tx{flex:1;min-width:0;font-size:13px;line-height:1.35}
.act .tx .who{font-weight:700;color:var(--dark)}
.act .tx .sub2{display:block;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .rt{flex:none;white-space:nowrap}
.act .dot{flex:none;width:8px;height:8px;border-radius:50%}
.act .bdg{flex:none;width:28px;height:28px;border-radius:9px}
.act .bdg svg{width:15px;height:15px}
.act.last li.row{padding:6px 0}
@media (max-width:720px){.act .tm{width:auto}.act .tm .muted{display:none}}

/* ---------- student cards ---------- */
.bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inp{padding:9px 14px;border:1px solid var(--rule);border-radius:999px;font-size:13px;background:#fff;font-family:inherit;color:var(--ink);min-width:220px}
select.inp{min-width:0}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sc{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;border:1px solid transparent}
.sc:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(35,10,73,.08),0 12px 28px rgba(35,10,73,.10);border-color:var(--rule)}
.sc .hd{display:flex;gap:12px;align-items:center}
.sc .nm{font-weight:700;font-size:14px;color:var(--dark);line-height:1.25}
.sc .st{font-size:11px;color:var(--muted);margin-top:2px}
.sc .row{margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.v{background:var(--violetBg);color:var(--dark2)}
.chip.a{background:var(--aquaBg);color:var(--aquaInk)}
.chip.t{background:var(--tangBg);color:var(--tangInk)}
.chip.g{background:var(--greenBg);color:var(--green)}
.chip.r{background:var(--redBg);color:var(--red)}
.chip.am{background:var(--amberBg);color:var(--amber)}
.chip.n{background:var(--rule2);color:var(--muted)}
.avw{position:relative;flex:none}
.adot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.bshelf.sm{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule2);gap:5px;min-height:35px;align-items:center}
.bshelf.sm .bdg{width:24px;height:24px;border-radius:7px}
.bshelf.sm .bdg svg{width:13px;height:13px}
.mini{display:flex;gap:3px;margin-top:12px}
.mini i{flex:1;height:6px;border-radius:3px;background:var(--rule2)}
.mini i.on{background:var(--dark2)}
.mini i.part{background:linear-gradient(90deg,var(--dark2) var(--p),var(--rule2) var(--p))}

/* ---------- matrix ---------- */
.tbl{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 210px)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule2);text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;background:#fff;color:var(--muted);font-size:11px;font-weight:700;z-index:2;white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
.mx thead tr.grp th{top:0;color:var(--dark);font-size:10px;letter-spacing:1px;text-align:center;border-bottom:0;padding-bottom:2px}
.mx thead tr.grp th span{display:block;border-bottom:3px solid var(--g,var(--dark2));padding-bottom:5px}
.mx thead tr.cols th{top:28px}
.mx{width:auto;min-width:100%}
.mx th.stc,.mx td.stc{position:sticky;left:0;background:#fff;z-index:1;min-width:210px}
.mx thead th.stc{z-index:3}
.mx td.c,.mx th.c{text-align:center;width:56px;min-width:56px;padding:5px 3px}
.mx th.c.hwc{box-shadow:inset 0 -3px 0 var(--tang)}
.legend .hwk{display:inline-block;width:14px;height:3px;background:var(--tang);vertical-align:middle;margin-right:6px;border-radius:2px}
.mx td.c{cursor:pointer}
.mx tbody tr:hover td{background:#FBF9F6}
.cell{display:block;border-radius:8px;padding:4px 2px;font-weight:700;font-size:12px;line-height:1.2}
.cell small{display:block;font-weight:500;font-size:10px;opacity:.8}
.cell sup{font-size:9px;margin-left:1px}
.k-g{background:var(--greenBg);color:var(--green)}.k-a{background:var(--amberBg);color:var(--amber)}.k-r{background:var(--redBg);color:var(--red)}
.k-ok{background:var(--violetBg);color:var(--dark2)}
.k-el{background:#fff;border:1.5px dashed var(--lilac);color:var(--dark2)}
.none{color:#D4CEC6}
.namec{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.namec:hover{color:var(--dark2)}
td.c,th.c{text-align:center}

/* ---------- alerts / profile ---------- */
.al{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--rule2)}
.al:last-child{border-bottom:0}
.al .sev{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.warn{background:var(--amberBg);color:var(--amber);padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:12px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(26,8,55,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:30px 12px;backdrop-filter:blur(2px)}
.modal.on{display:flex}
.mcard{background:var(--cream);max-width:1000px;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(26,8,55,.35)}
.mhd{background:radial-gradient(120% 160% at 100% 0%,#5B1FC0 0%,var(--dark2) 35%,var(--dark) 80%);color:#fff;padding:22px 24px;display:flex;gap:18px;align-items:center;position:relative}
.mhd h2{margin:0;font-size:22px;font-weight:800}
.mhd .meta{font-size:12px;color:#DCCBFA;margin-top:4px}
.mhd .meta a{color:var(--aqua)}
.x{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.12);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.mbd{padding:18px 20px 22px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kp b{display:block;font-size:20px;font-weight:800;color:var(--dark)}
.kp span{font-size:11px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}

<script>
/**
 * PMP oyunlaşdırma mühərriki — XP, nişanlar (pilləli, tək, gizli), həftəlik tapşırıqlar.
 * TƏK MƏNBƏ: eyni kod həm serverdə (məktublar, tələbə faylları), həm səhifədə işləyir.
 * Saf funksiya: eyni məlumat + eyni an → eyni nəticə. Heç nə yadda saxlamır, ona görə «itən» nişan olmur.
 * Vaxt: Bakı (UTC+4, yay vaxtı yoxdur). Həftə bazar ertəsi 00:00-da başlayır.
 */
var GAME_ = (function () {
  var OFF = 4 * 3600e3, DAY = 864e5;
  var TIER_NM = ['', 'Bürünc', 'Gümüş', 'Qızıl'];
  var TIER_XP = [0, 10, 25, 50];
  var Q_XP = 15, HERO_XP = 25;

  // ---------- nişanlar ----------
  // kind: 'tier' (3 pillə) | 'one' (tək) ; priv: faiz/zəiflik göstərir → yalnız sahibi (və müəllim) görür ; hidden: şərti gizli
  var DEFS = [
    { id: 'start', nm: 'Start', ic: 'flag', kind: 'one', xp: 10, ds: 'Diaqnostik testi keçdi' },
    { id: 'streak', nm: 'Ardıcıllıq', ic: 'flame', kind: 'tier', goal: [3, 7, 14], unit: 'gün dalbadal test həll etdi' },
    { id: 'phase', nm: 'Mərhələ fatehi', ic: 'map', kind: 'tier', goal: [1, 2, 3], unit: 'mərhələni tam bitirdi', note: 'Mərhələlər: People (T1–3 + People Domain + Mini 1), Process (T4–8 + Process Domain + Mini 2–4), Business (T9–11 + BE Domain + Mini 5)' },
    { id: 'mock', nm: 'Mock döyüşçüsü', ic: 'target', kind: 'tier', goal: [1, 6, 12], unit: 'Mock Exam həll etdi' },
    { id: 'aim', nm: 'Hədəf atıcısı', ic: 'star', kind: 'tier', goal: [3, 10, 20], unit: 'testdə hədəfə çatdı', priv: true },
    { id: 'ellog', nm: 'Error Log ustası', ic: 'book', kind: 'tier', goal: [5, 15, 30], unit: 'testi Error Log-a yazdı' },
    { id: 'retake', nm: 'Təkrarçı', ic: 'repeat', kind: 'tier', goal: [1, 3, 5], unit: 'zəif testi təkrar edib yaxşılaşdırdı', priv: true },
    { id: 'tempo', nm: 'Vaxta sığan', ic: 'clock', kind: 'tier', goal: [5, 15, 30], unit: 'testdə vaxta sığdı' },
    { id: 'ready', nm: 'PMP Ready', ic: 'trophy', kind: 'one', xp: 50, ds: 'Son 3 Mock-un ortası hədəfdədir', priv: true },
    { id: 'night', nm: 'Gecə növbəsi', ic: 'moon', kind: 'one', xp: 20, hidden: true, ds: '23:00-dan sonra test həll etdi' },
    { id: 'early', nm: 'Erkən start', ic: 'sunrise', kind: 'one', xp: 20, hidden: true, ds: 'Səhər 07:00-dan əvvəl test həll etdi' },
    { id: 'comeback', nm: 'Geri dönüş', ic: 'rocket', kind: 'one', xp: 20, hidden: true, ds: 'Eyni testdə nəticəsini +25 bal artırdı', priv: true },
    { id: 'perfect', nm: 'Mükəmməl', ic: 'gem', kind: 'one', xp: 20, hidden: true, ds: 'Bir testdən 100% topladı', priv: true },
    { id: 'weekend', nm: 'Həftəsonu döyüşçüsü', ic: 'calendar', kind: 'one', xp: 20, hidden: true, ds: 'Həm şənbə, həm bazar test həll etdi' }
  ];
  var BY = {}; DEFS.forEach(function (d) { BY[d.id] = d; });

  var QUESTS = [
    { id: 'q3', nm: 'Bu həftə 3 test həll et', goal: 3 },
    { id: 'qlog', nm: 'Həll etdiklərinin hamısını Error Log-a yaz', goal: 1 },
    { id: 'qre', nm: 'Bir zəif testi təkrar et', goal: 1 }
  ];

  // ---------- köməkçilər ----------
  function ms(iso) { var x = Date.parse(iso); return isNaN(x) ? null : x; }
  function dk(t) { return new Date(t + OFF).toISOString().slice(0, 10); }
  function hr(t) { return new Date(t + OFF).getUTCHours(); }
  function wday(t) { return new Date(t + OFF).getUTCDay(); }
  function wk(t) { var d = new Date(t + OFF), w = (d.getUTCDay() + 6) % 7; return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - w) - OFF; }
  function prevKey(k) { var d = new Date(k + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - 1); return d.toISOString().slice(0, 10); }
  function nextKey(k) { var d = new Date(k + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); }
  function dmy(s) { var m = String(s || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); return m ? Date.UTC(+m[3], m[2] - 1, +m[1], 8) : null; }
  function num(v) { return typeof v === 'number' && !isNaN(v) ? v : null; }
  function testXp(t) { if (t === 'Diaqnostik') return 5; if (/^\d+\./.test(t)) return 10; if (/Domain$/.test(t)) return 15; if (/^Mini/.test(t)) return 20; if (/^Mock/.test(t)) return 40; return 0; }
  function phaseOf(t) {
    var m = String(t).match(/^(\d+)\./);
    if (m) { var n = +m[1]; return n <= 3 ? 0 : n <= 8 ? 1 : 2; }
    if (t === 'People Domain' || t === 'Mini Exam 1') return 0;
    if (t === 'Process Domain' || t === 'Mini Exam 2' || t === 'Mini Exam 3' || t === 'Mini Exam 4') return 1;
    if (t === 'Business Environment Domain' || t === 'Mini Exam 5') return 2;
    return -1;
  }
  var PHASE_N = [5, 9, 5];
  function label(key) { var p = String(key).split(':'), d = BY[p[0]]; if (!d) return key; return d.kind === 'tier' ? d.nm + ' — ' + TIER_NM[+p[1] || 1] : d.nm; }
  function tierDs(d, tier) { return d.goal[tier - 1] + ' ' + d.unit; }

  // ---------- bir tələbə ----------
  function one(s, atts, hedef, now) {
    var ev = [], formTests = {}, xpLog = [], earned = [], badges = {};
    atts.forEach(function (a) { var t = ms(a.ts); if (t == null || !a.test) return; formTests[a.test] = 1; ev.push({ t: t, test: a.test, pct: num(a.pct), f: true }); });
    var elTests = (s.el && s.el.tests) || [];
    elTests.forEach(function (x) { if (!x || !x.ad || formTests[x.ad]) return; var t = dmy(x.tarix); if (t != null) ev.push({ t: t, test: x.ad, pct: num(x.pct), f: false }); });
    ev.sort(function (a, b) { return a.t - b.t || (a.test < b.test ? -1 : a.test > b.test ? 1 : 0); });

    function earn(id, tier, t) {
      var key = BY[id].kind === 'tier' ? id + ':' + tier : id;
      if (badges[key]) return;
      var x = BY[id].kind === 'tier' ? TIER_XP[tier] : BY[id].xp;
      badges[key] = t; earned.push({ id: id, tier: tier || 0, key: key, t: t, xp: x }); xpLog.push({ t: t, xp: x, why: 'b' });
    }
    function tiers(id, val, t) { var g = BY[id].goal; for (var i = 0; i < 3; i++) if (val >= g[i]) earn(id, i + 1, t); }

    var seen = {}, days = {}, phaseDone = [{}, {}, {}], phases = 0, mocks = {}, minPrev = {}, aimSet = {}, retakeSet = {}, maxRun = 0;
    var mockLatest = {};
    ev.forEach(function (e) {
      // XP: ilk dəfə mərhələ XP-si, təkrar +3
      xpLog.push({ t: e.t, xp: seen[e.test] ? 3 : testXp(e.test), why: 't' });
      var first = !seen[e.test]; seen[e.test] = 1;
      if (e.test === 'Diaqnostik') earn('start', 0, e.t);
      // ardıcıllıq
      var k = dk(e.t); days[k] = 1; var run = 0, kk = k; while (days[kk]) { run++; kk = prevKey(kk); } maxRun = Math.max(maxRun, run); tiers('streak', maxRun, e.t);
      // mərhələ
      var ph = phaseOf(e.test);
      if (ph >= 0 && first) { phaseDone[ph][e.test] = 1; if (Object.keys(phaseDone[ph]).length === PHASE_N[ph]) { phases++; tiers('phase', phases, e.t); } }
      // mock
      if (/^Mock/.test(e.test)) { mocks[e.test] = 1; tiers('mock', Object.keys(mocks).length, e.t); }
      // faizlə bağlı
      if (e.pct != null) {
        if (e.pct >= hedef && !aimSet[e.test]) { aimSet[e.test] = 1; tiers('aim', Object.keys(aimSet).length, e.t); }
        var mp = minPrev[e.test];
        if (mp != null) {
          if (mp < hedef && e.pct > mp && !retakeSet[e.test]) { retakeSet[e.test] = 1; tiers('retake', Object.keys(retakeSet).length, e.t); }
          if (e.pct - mp >= 0.25 - 1e-9) earn('comeback', 0, e.t);
        }
        minPrev[e.test] = mp == null ? e.pct : Math.min(mp, e.pct);
        if (e.pct >= 0.995) earn('perfect', 0, e.t);
        if (/^Mock/.test(e.test)) {
          mockLatest[e.test] = { t: e.t, p: e.pct };
          var ml = Object.keys(mockLatest).map(function (m) { return mockLatest[m]; }).sort(function (a, b) { return a.t - b.t; }).slice(-3);
          if (ml.length >= 3 && ml.reduce(function (p, x) { return p + x.p; }, 0) / 3 >= hedef - 1e-9) earn('ready', 0, e.t);
        }
      }
      // vaxt (yalnız saatı bilinən Forms cəhdləri)
      if (e.f) { var h = hr(e.t); if (h >= 23 || h < 5) earn('night', 0, e.t); else if (h < 7) earn('early', 0, e.t); }
      // həftəsonu
      var wdv = wday(e.t);
      if ((wdv === 6 && days[nextKey(k)]) || (wdv === 0 && days[prevKey(k)])) earn('weekend', 0, e.t);
    });

    // Error Log əsaslı (tarix günü ilə)
    var logged = {}, logList = [], tempoList = [];
    elTests.forEach(function (x) {
      if (!x || !x.ad) return; var t = dmy(x.tarix); if (t == null) return;
      if (!logged[x.ad]) { logged[x.ad] = t; logList.push(t); }
      if (x.temp && !/^gecikir/i.test(String(x.temp))) tempoList.push(t);
    });
    logList.sort(function (a, b) { return a - b; }); tempoList.sort(function (a, b) { return a - b; });
    logList.forEach(function (t, i) { tiers('ellog', i + 1, t); });
    tempoList.forEach(function (t, i) { tiers('tempo', i + 1, t); });

    // həftəlik tapşırıqlar (hər həftə üçün — XP sabit qalsın)
    var weeks = {}, heroWeeks = 0, curW = wk(now), cur = null;
    ev.forEach(function (e) { var w = wk(e.t); (weeks[w] = weeks[w] || []).push(e); });
    if (!weeks[curW]) weeks[curW] = [];
    var hist = {}; // test → əvvəlki cəhdlərin min faizi (xronoloji)
    var allByT = ev.slice();
    Object.keys(weeks).map(Number).sort(function (a, b) { return a - b; }).forEach(function (w) {
      var es = weeks[w], n = es.length;
      var tried = {}; es.forEach(function (e) { if (e.test !== 'Diaqnostik' && !(e.pct != null && e.pct >= 0.995)) tried[e.test] = 1; });
      var tl = Object.keys(tried), lg = tl.filter(function (t) { return logged[t] != null; }).length;
      var re = es.some(function (e) {
        return allByT.some(function (p) { return p.test === e.test && p.t < e.t && p.pct != null && p.pct < hedef; });
      });
      var items = [
        { id: 'q3', nm: QUESTS[0].nm, val: Math.min(n, 3), goal: 3, done: n >= 3 },
        { id: 'qlog', nm: QUESTS[1].nm, val: lg, goal: tl.length || 1, done: tl.length > 0 && lg === tl.length },
        { id: 'qre', nm: QUESTS[2].nm, val: re ? 1 : 0, goal: 1, done: re }
      ];
      var endT = Math.min(w + 7 * DAY - 1, now), dn = 0;
      items.forEach(function (q) { if (q.done) { dn++; xpLog.push({ t: endT, xp: Q_XP, why: 'q', w: w }); } });
      var hero = dn === 3; if (hero) { heroWeeks++; xpLog.push({ t: endT, xp: HERO_XP, why: 'h', w: w }); }
      if (w === curW) cur = { week: new Date(w).toISOString(), items: items, done: dn, hero: hero };
    });

    // ümumi
    var xp = 0, xpWeek = 0;
    xpLog.forEach(function (x) { xp += x.xp; if (x.w != null ? x.w === curW : x.t >= curW) xpWeek += x.xp; });
    var today = dk(now), sk = days[today] ? today : prevKey(today), streak = 0; while (days[sk]) { streak++; sk = prevKey(sk); }
    var prog = {
      streak: maxRun, phase: phases, mock: Object.keys(mocks).length, aim: Object.keys(aimSet).length,
      ellog: logList.length, retake: Object.keys(retakeSet).length, tempo: tempoList.length
    };
    earned.sort(function (a, b) { return a.t - b.t; });
    return { xp: xp, xpWeek: xpWeek, streak: streak, best: maxRun, badges: badges, earned: earned.map(function (x) { return { id: x.id, tier: x.tier, key: x.key, ts: new Date(x.t).toISOString(), xp: x.xp }; }), prog: prog, quests: cur, heroWeeks: heroWeeks };
  }

  /** Bütün qrup üçün hesablayır. data: {students, attempts, cfg}; nowIso: indiki an (yoxdursa — indi). */
  function calc(data, nowIso) {
    var now = ms(nowIso) || Date.now(), hedef = (data && data.cfg && num(data.cfg.hedef)) || 0.75, by = {};
    var atts = {}; ((data && data.attempts) || []).forEach(function (a) { if (!a || a.kind === 'ready' || !a.student) return; (atts[a.student] = atts[a.student] || []).push(a); });
    ((data && data.students) || []).forEach(function (s) { if (s && s.ad) { try { by[s.ad] = one(s, atts[s.ad] || [], hedef, now); } catch (e) { by[s.ad] = { xp: 0, xpWeek: 0, streak: 0, best: 0, badges: {}, earned: [], prog: {}, quests: null, heroWeeks: 0, err: String(e && e.message || e) }; } } });
    return { v: 2, at: new Date(now).toISOString(), by: by };
  }

  /** Tələbə görünüşü: özü — hamısı; başqaları — XP, seriya, açıq nişanlar (faizlə bağlılar yox). */
  function forViewer(g, me) {
    var out = { v: g.v, at: g.at, by: {} };
    Object.keys(g.by).forEach(function (n) {
      var x = g.by[n];
      if (n === me) { out.by[n] = x; return; }
      var b = {}; Object.keys(x.badges).forEach(function (k) { if (!BY[k.split(':')[0]].priv) b[k] = x.badges[k]; });
      out.by[n] = { xp: x.xp, xpWeek: x.xpWeek, streak: x.streak, best: x.best, badges: b,
        earned: x.earned.filter(function (e) { return !BY[e.id].priv; }), hero: !!(x.quests && x.quests.hero), heroWeeks: x.heroWeeks };
    });
    return out;
  }

  return { DEFS: DEFS, BY: BY, QUESTS: QUESTS, TIER_NM: TIER_NM, TIER_XP: TIER_XP, Q_XP: Q_XP, HERO_XP: HERO_XP, calc: calc, forViewer: forViewer, label: label, tierDs: tierDs };
})();

/**
 * Tələbə üçün məlumat süzgəci — həm serverdə (API), həm müəllim önizləməsində işləyir.
 * Tələbə: öz nəticələri tam; başqalarının yalnız ✓ + tarix; qrup ortaları — yalnız ≥ MIN_N nəfər keçibsə.
 */
var MIN_N_ = 3;
function studentView_(data, me) {
  var lastPct = {}; // test -> { student -> {ts, pct} }
  function put(test, who, ts, p) {
    if (p == null || isNaN(p)) return;
    var t = lastPct[test] = lastPct[test] || {};
    if (!t[who] || t[who].ts < ts) t[who] = { ts: ts, pct: p };
  }
  data.attempts.forEach(function (a) { if (a.student && a.kind !== 'ready') put(a.test, a.student, a.ts, a.pct); });
  data.students.forEach(function (s) {
    ((s.el && s.el.tests) || []).forEach(function (t) {
      var m = String(t.tarix || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
      var iso = m ? new Date(Date.UTC(+m[3], m[2] - 1, +m[1], 8)).toISOString() : '';
      var has = data.attempts.some(function (a) { return a.student === s.ad && a.test === t.ad; });
      if (!has) put(t.ad, s.ad, iso, t.pct);
    });
  });
  var groupAvg = {}, perStudent = {};
  Object.keys(lastPct).forEach(function (test) {
    var who = Object.keys(lastPct[test]), vals = who.map(function (w) { return lastPct[test][w].pct; });
    groupAvg[test] = { n: who.length, avg: who.length >= MIN_N_ ? vals.reduce(function (p, x) { return p + x; }, 0) / vals.length : null };
    if (test !== 'Diaqnostik') who.forEach(function (w) { (perStudent[w] = perStudent[w] || []).push(lastPct[test][w].pct); });
  });
  var stAvgs = Object.keys(perStudent).map(function (w) { var a = perStudent[w]; return a.reduce(function (p, x) { return p + x; }, 0) / a.length; });
  var groupAll = stAvgs.length >= MIN_N_ ? stAvgs.reduce(function (p, x) { return p + x; }, 0) / stAvgs.length : null;

  var students = data.students.map(function (s) {
    if (s.ad === me) return s;
    return { ad: s.ad, imtahan: '', el: { tests: ((s.el && s.el.tests) || []).map(function (t) { return { tarix: t.tarix, ad: t.ad }; }) } };
  });
  var attempts = data.attempts.filter(function (a) { return a.student && a.kind !== 'ready'; }).map(function (a) {
    if (a.student === me) return a;
    return { test: a.test, ts: a.ts, student: a.student, kind: a.kind };
  });
  return {
    updated: data.updated, partial: false, errors: [], unmatched: [], tests: data.tests,
    cfg: { hedef: data.cfg.hedef, zeif: data.cfg.zeif, passivGun: data.cfg.passivGun, gozleyenLimit: data.cfg.gozleyenLimit, tz: data.cfg.tz, hw: data.cfg.hw || [] },
    students: students, attempts: attempts,
    readiness: data.readiness.filter(function (r) { return r.student === me; }),
    links: data.links || {},
    lockView: 'student', me: me, groupAvg: groupAvg, groupAll: groupAll, minN: MIN_N_, sample: data.sample,
    game: GAME_.forViewer(GAME_.calc(data, new Date().toISOString()), me)
  };
}

/* PMP Hazırlıq Paneli — client */
var FULL = DATA, V = DATA, VDc = null;
var TZ = (DATA.cfg && DATA.cfg.tz) || 'Asia/Baku';
var LOCK = DATA.lockView || null;           // 'student' → tələbə linki (yalnız öz nəticələri + qrup)

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(iso, withTime){ if(!iso) return '—'; var o={timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric'}; if(withTime){o.hour='2-digit';o.minute='2-digit';o.hour12=false;} return new Intl.DateTimeFormat('en-GB',o).format(new Date(iso)).replace(/\//g,'.').replace(',', ''); }
function fmtShort(iso){ if(!iso) return ''; return new Intl.DateTimeFormat('en-GB',{timeZone:TZ,day:'2-digit',month:'2-digit'}).format(new Date(iso)).replace('/','.'); }
function dayKey(iso){ return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso)); }
function dmy(s){ var m=String(s||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); return m? new Date(Date.UTC(+m[3],m[2]-1,+m[1],8)).toISOString():null; }
function pct(v){ return v==null||isNaN(v)?'—':Math.round(v*100)+'%'; }
function cls(v){ if(v==null||isNaN(v)) return ''; var c=V.cfg; return v>=c.hedef?'g':v>=c.zeif?'a':'r'; }
function daysAgo(iso){ return iso? Math.floor((Date.now()-new Date(iso).getTime())/864e5):null; }
function ago(iso){ var d=daysAgo(iso); if(d==null) return 'heç vaxt'; if(d<=0) return 'bu gün'; if(d===1) return 'dünən'; return d+' gün əvvəl'; }
function avg(a){ return a.length? a.reduce(function(p,x){return p+x;},0)/a.length : null; }
function pill(t,c){ return '<span class="chip '+(c||'n')+'">'+esc(t)+'</span>'; }
function stCls(v){ return {g:'g',a:'am',r:'r'}[cls(v)]||'n'; }
function shortTest(t){ if(t==='Diaqnostik') return 'D'; var m=t.match(/^(\d+)\./); if(m) return m[1]; if(/^People/.test(t)) return 'PPL'; if(/^Process/.test(t)) return 'PRC'; if(/^Business/.test(t)) return 'BE'; var k=t.match(/^(Mini|Mock) Exam (\d+)/); if(k) return k[2]; return t; }

function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }

/* ---------- rings ---------- */
function ring(frac, size, stroke, col, track, label, sub, labCol){
  var r=(size-stroke)/2, C=2*Math.PI*r, f=Math.max(0,Math.min(1,frac||0));
  var h='<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+esc(label)+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+track+'" stroke-width="'+stroke+'"/>'+
    (f>0?'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+(C*f).toFixed(2)+' '+C.toFixed(2)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>':'');
  if(label!=null) h+='<text x="50%" y="'+(sub?'47%':'50%')+'" text-anchor="middle" dominant-baseline="central" font-size="'+Math.round(size*0.26)+'" font-weight="800" fill="'+(labCol||'var(--dark)')+'">'+esc(label)+'</text>';
  if(sub) h+='<text x="50%" y="70%" text-anchor="middle" dominant-baseline="central" font-size="'+Math.max(9,Math.round(size*0.12))+'" fill="var(--muted)">'+esc(sub)+'</text>';
  return h+'</svg>';
}

var TIER_COL=[['var(--violetBg)','var(--dark2)'],['#F8E6D6','#8A4B14'],['#ECEFF3','#4F5866'],['#FFF1C2','#8A6A00']];
function canSee(d){ return !d.priv || STU() || P(); }
function badgeIc(d, tier, off, hid){
  var c=d.kind==='tier'?TIER_COL[tier||1]:(d.hidden?['#EDE9F5','var(--dark)']:TIER_COL[0]); if(off) c=['#F2EFEA','#B9B2C4'];
  var tip=hid?'Gizli nişan — şərti sirdir, tap!':d.nm+(d.kind==='tier'?' · '+GAME_.TIER_NM[tier||1]:'')+' — '+(d.kind==='tier'?GAME_.tierDs(d,tier||1):d.ds);
  return '<span class="bdg'+(off?' off':'')+'" style="background:'+c[0]+';color:'+c[1]+'" data-tip="'+esc(tip)+'">'+svg(hid?'lock':d.ic)+(d.kind==='tier'&&!off?'<em>'+['','I','II','III'][tier||1]+'</em>':'')+'</span>';
}
function topTier(o,id){ var t=0; for(var i=1;i<=3;i++) if(o.badges[id+':'+i]) t=i; return t; }
function isHero(o){ return !!(o.g&&((o.g.quests&&o.g.quests.hero)||o.g.hero)); }
function shelf(o){
  var out=[]; GAME_.DEFS.forEach(function(d){ if(!canSee(d)) return; if(d.kind==='tier'){ var t=topTier(o,d.id); if(t) out.push(badgeIc(d,t)); } else if(o.badges[d.id]) out.push(badgeIc(d)); });
  if(isHero(o)) out.push('<span class="bdg" style="background:var(--tangBg);color:var(--tangInk)" data-tip="Həftənin qəhrəmanı — bu həftənin 3 tapşırığını bitirdi">'+svg('bolt')+'</span>');
  return out;
}
function badgeCount(o){ var n=0,tot=0; GAME_.DEFS.forEach(function(d){ if(!canSee(d)) return; if(d.kind==='tier'){ tot+=3; n+=topTier(o,d.id); } else { tot++; if(o.badges[d.id]) n++; } }); return [n,tot]; }

/* ---------- compute ---------- */
var S = {};
function compute(){
  S = { by:{}, tests: V.tests.slice(), events: [], earned: [] };
  V.attempts.forEach(function(a){ if(a.test && S.tests.indexOf(a.test)<0) S.tests.push(a.test); });
  S.stageTests = STAGES.map(function(st){ return S.tests.filter(st.test); });
  V.students.forEach(function(s){
    S.by[s.ad] = { s:s, forms:{}, all:[], el:s.el||{tests:[]}, elTests:{}, ev:[], last:null };
    (s.el.tests||[]).forEach(function(t){ (S.by[s.ad].elTests[t.ad]=S.by[s.ad].elTests[t.ad]||[]).push(t); });
  });
  V.attempts.forEach(function(a){ var o=S.by[a.student]; if(!o) return; o.all.push(a); (o.forms[a.test]=o.forms[a.test]||[]).push(a); });
  Object.keys(S.by).forEach(function(k){
    var o=S.by[k];
    o.all.sort(function(a,b){return a.ts<b.ts?1:-1;});
    Object.keys(o.forms).forEach(function(t){ o.forms[t].sort(function(a,b){return a.ts<b.ts?1:-1;}); });
    // events: Forms + Error Log (Forms-da olmayan testlər)
    o.all.forEach(function(a){ o.ev.push({ ts:a.ts, test:a.test, pct:a.pct, src:'f' }); });
    (o.el.tests||[]).forEach(function(t){ if(o.forms[t.ad]) return; var iso=dmy(t.tarix); if(iso) o.ev.push({ ts:iso, test:t.ad, pct:t.pct, src:'el' }); });
    o.ev.sort(function(a,b){return a.ts<b.ts?-1:1;});
    o.ev.forEach(function(e){ S.events.push({ who:k, ts:e.ts, test:e.test, pct:e.pct }); });
    o.last = o.ev.length? o.ev[o.ev.length-1].ts : null;
    // done set
    o.done={}; o.ev.forEach(function(e){ o.done[e.test]=(o.done[e.test]||0)+1; });
    o.nDone=Object.keys(o.done).length;
    o.st=STAGES.map(function(st){ return Object.keys(o.done).filter(st.test).length; });
    o.stage=-1; o.st.forEach(function(n,i){ if(n>0) o.stage=i; });
    // last % per test (non-diag)
    var lastP=Object.keys(o.done).filter(function(t){return t!=='Diaqnostik';}).map(function(t){ var f=o.forms[t]; if(f) return f[0].pct; var e=o.elTests[t]; return e?e[e.length-1].pct:null; }).filter(function(v){return v!=null;});
    o.avg=avg(lastP);
    o.diag=o.forms['Diaqnostik']?o.forms['Diaqnostik'][0]:null;
    o.ready=V.readiness.filter(function(r){return r.student===k;})[0]||null;
    var days={}; o.ev.forEach(function(e){ days[dayKey(e.ts)]=1; }); o.days=days;
    o.alerts=alertsFor(o);
  });
  // XP, nişanlar, tapşırıqlar — GAME_ (tələbə görünüşündə serverdən hazır gəlir, müəllimdə burada hesablanır)
  var G=(V.game&&V.game.v===2)?V.game:GAME_.calc(V,new Date().toISOString());
  Object.keys(S.by).forEach(function(k){
    var o=S.by[k], g=G.by[k]||{xp:0,xpWeek:0,streak:0,badges:{},earned:[]};
    o.g=g; o.xp=g.xp||0; o.xpWeek=g.xpWeek||0; o.streak=g.streak||0; o.badges=g.badges||{};
    (g.earned||[]).forEach(function(e){ var d=GAME_.BY[e.id]; if(d) S.earned.push({ who:k, d:d, tier:e.tier, ts:e.ts }); });
  });
  S.events.sort(function(a,b){return a.ts<b.ts?1:-1;});
  S.earned.sort(function(a,b){return a.ts<b.ts?1:-1;});
  S.list=Object.keys(S.by).map(function(k){return S.by[k];});
}
function prevDay(key){ var d=new Date(key+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-1); return d.toISOString().slice(0,10); }
function runEnding(days, key){ var n=0; while(days[key]){ n++; key=prevDay(key); } return n; }
function streakOf(days){ var today=dayKey(new Date().toISOString()); var k=days[today]?today:prevDay(today); return runEnding(days,k); }

function alertsFor(o){
  var c=V.cfg, a=[], s=o.s, d=daysAgo(o.last);
  if(d==null) a.push(['r','Hələ heç bir test keçməyib']);
  else if(d>=c.passivGun) a.push(['r', d+' gündür test keçməyib (son: '+fmt(o.last)+')']);
  var recent=o.ev.filter(function(x){return x.test!=='Diaqnostik'&&x.pct!=null;}).slice(-3);
  if(recent.length>=2){ var av_=avg(recent.map(function(x){return x.pct;})); if(av_<c.zeif) a.push(['r', P()?'Son '+recent.length+' testin ortası '+pct(av_)+' — '+pct(c.zeif)+'-dən aşağı':'Son '+recent.length+' testin nəticəsi zəifdir']); }
  if(s.imtahan){ var left=Math.ceil((new Date(s.imtahan)-Date.now())/864e5); if(left>=0&&left<=30&&(o.avg==null||o.avg<c.hedef)) a.push(['r','İmtahana '+left+' gün qalıb, '+(P()?'orta nəticə '+pct(o.avg):'nəticə hədəfdən aşağıdır')]); }
  var notLogged=Object.keys(o.forms).filter(function(t){ if(t==='Diaqnostik') return false; var x=o.forms[t][0]; return x.pct!=null&&x.pct<1&&!o.elTests[t]&&daysAgo(x.ts)<=21; });
  if(notLogged.length) a.push(['a','Forms-da keçib, Error Log-a yazmayıb: '+notLogged.join(', ')]);
  if((o.el.pending||0)>=c.gozleyenLimit) a.push(['a',o.el.pending+' səhv sualına hələ baxılmayıb (Error Log)']);
  var lastEl=(s.el.tests||[]).slice(-1)[0]; if(lastEl&&/^Gecikir/.test(lastEl.temp||'')) a.push(['a','Son testdə vaxta sığmayıb: '+lastEl.ad+' — '+lastEl.temp]);
  if(!o.diag) a.push(['n','Diaqnostik test nəticəsi tapılmadı']);
  return a;
}

/* ---------- views ---------- */
function tabs(){
  var nA=0; S.list.forEach(function(o){ nA+=o.alerts.filter(function(x){return x[0]==='r';}).length; });
  if(STU()){ var ts=[['me','Mənim nəticələrim'],['overview','Qrup'],['matrix','Kim nəyi keçib']]; if(!ts.some(function(x){return x[0]===state.tab;})) state.tab='me';
    return ts.map(function(x){ return '<button class="'+(state.tab===x[0]?'on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>'; }).join(''); }
  var t=[['overview','İcmal']]; if(T()) t.push(['activity','Aktivlik',actToday()]); t=t.concat([['students','Tələbələr'],['matrix','Cədvəl']]);
  if(T()) t=t.concat([['alerts','Xəbərdarlıqlar',nA],['profile','Qrup profili'],['xat','Xatırlatmalar'],['unmatched','Uyğunlaşmayan adlar',uniqUnmatched().length]]);
  if(!t.some(function(x){return x[0]===state.tab;})) state.tab='overview';
  return t.map(function(x){ return '<button class="'+(state.tab===x[0]?'on':'')+'" data-t="'+x[0]+'">'+x[1]+(x[2]?'<span class="n">'+x[2]+'</span>':'')+'</button>'; }).join('');
}

function groupStats(){
  var N=S.list.length, total=N*S.tests.length;
  var done=S.list.reduce(function(p,o){return p+o.nDone;},0);
  var week=S.events.filter(function(e){return daysAgo(e.ts)<7;});
  var activeW={}; week.forEach(function(e){activeW[e.who]=1;});
  var best=S.list.reduce(function(m,o){return o.streak>m.streak?o:m;},{streak:0});
  var gAvg=STU()?V.groupAll:avg(S.list.map(function(o){return o.avg;}).filter(function(v){return v!=null;}));
  var exams=S.list.map(function(o){return o.s.imtahan;}).filter(function(d){return d&&new Date(d)>=new Date(Date.now()-864e5);}).sort();
  return { N:N, total:total, done:done, week:week.length, activeW:Object.keys(activeW).length, best:best, gAvg:gAvg, nextExam:exams[0]||null };
}

function hero(g){
  var frac=g.total?g.done/g.total:0;
  var h='<div class="hero"><span class="shape s1"></span><span class="shape s2"></span><span class="shape s3"></span><div class="hero-in">';
  h+='<div class="bigring">'+ring(frac,150,12,'var(--aqua)','rgba(255,255,255,.14)',null)+'<div class="c"><div><b class="num">'+Math.round(frac*100)+'%</b><span>yolun tamamlanıb</span></div></div></div>';
  h+='<div><div class="eyebrow">PMP 2026 · '+(T()?'Qrup icmalı':'Bizim qrup')+'</div>';
  h+= T() ? '<h1>Qrup hazırlıq yolunun '+Math.round(frac*100)+'%-ni keçib</h1><p>'+g.N+' tələbə · '+S.tests.length+' test · bu həftə '+g.activeW+' tələbə aktivdir.</p>'
          : '<h1>Birlikdə imtahana doğru</h1><p>Hər tamamlanan test səni imtahana bir addım yaxınlaşdırır. Bu həftə qrup '+g.week+' test həll edib.</p>';

    if(o.alerts.length) h+='<div class="card" style="margin-bottom:14px"><h3>Diqqət</h3>'+o.alerts.map(function(a){ return '<div class="al">'+pill(a[0]==='r'?'vacib':a[0]==='a'?'diqqət':'qeyd',a[0]==='r'?'r':a[0]==='a'?'am':'n')+'<div class="small">'+esc(a[1])+'</div></div>'; }).join('')+'</div>';
    var et=(s.el.tests||[]).slice().reverse();
    h+='<div class="grid g2" style="margin-bottom:14px"><div class="card"><h3>Error Log — testlər</h3>'+(et.length? '<table><thead><tr><th>Tarix</th><th>Test</th>'+(P()?'<th class="c">Nəticə</th>':'')+'<th class="c">Vaxt</th><th class="c">Temp</th></tr></thead><tbody>'+et.map(function(t){ return '<tr><td class="small">'+esc(t.tarix)+'</td><td class="small">'+esc(t.ad)+'</td>'+(P()?'<td class="c">'+(t.pct!=null?pill(pct(t.pct),stCls(t.pct)):'—')+'</td>':'')+'<td class="c small">'+esc(t.vaxt||'—')+'</td><td class="c">'+(t.temp?pill(t.temp,/^Gecikir/.test(t.temp)?'r':'g'):'—')+'</td></tr>'; }).join('')+'</tbody></table>':'<div class="muted small">Error Log-a hələ test yazmayıb.</div>')+'</div>';
    h+='<div class="card"><h3>Error Log — səhvlər</h3><div class="qa"><div><span>Cəmi səhv:</span> <b>'+(o.el.nErr||0)+'</b> · bağlanıb '+(o.el.done||0)+' · gözləyir <b style="color:'+((o.el.pending||0)>=c.gozleyenLimit?'var(--red)':'var(--ink)')+'">'+(o.el.pending||0)+'</b></div><div><span>Zəif domain:</span> '+esc(o.el.zeif||'—')+'</div><div><span>Əsas səbəb:</span> '+esc(o.el.sebeb||'—')+'</div>'+
      Object.keys(o.el.dom||{}).map(function(k){return '<div><span>'+esc(k)+':</span> '+o.el.dom[k]+' səhv</div>';}).join('')+'</div></div></div>';
    if(o.ready) h+='<div class="card"><h3>Hazırlıq forması — '+fmt(o.ready.ts)+'</h3><div class="qa">'+(o.ready.answers||[]).slice(2).filter(function(q){return q[1];}).map(function(q){return '<div><span>'+esc(String(q[0]).split(' / ')[0])+'</span><br>'+esc(cleanAns(q[1]))+'</div>';}).join('')+'</div></div>';
    else h+='<div class="card"><h3>Hazırlıq forması</h3><div class="muted small">Doldurmayıb.</div></div>';
  }
  h+='</div>';
  document.getElementById('mcard').innerHTML=h;
  document.getElementById('modal').className='modal on';
  document.getElementById('close').onclick=closeModal;
  bindTips(document.getElementById('mcard'));
}
function closeModal(){ document.getElementById('modal').className='modal'; }
document.getElementById('modal').onclick=function(e){ if(e.target.id==='modal') closeModal(); };
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });

/* ---------- tooltip ---------- */
var tip=document.getElementById('tip');
function bindTips(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-tip]'),function(el){
    el.onmousemove=function(ev){ tip.textContent=el.getAttribute('data-tip'); tip.className='on'; var x=ev.clientX+14, y=ev.clientY+14; var w=tip.offsetWidth, hh=tip.offsetHeight; if(x+w>window.innerWidth-8) x=ev.clientX-w-10; if(y+hh>window.innerHeight-8) y=ev.clientY-hh-10; tip.style.left=x+'px'; tip.style.top=y+'px'; };
    el.onmouseleave=function(){ tip.className=''; };
  });
}

/* ---------- render ---------- */
function render(){
  V=VD(); compute();
  document.getElementById('grp').textContent=S.list.length+' tələbə · '+S.tests.length+' test';
  var sv=document.getElementById('segView'); sv.style.display=LOCK?'none':'';
  Array.prototype.forEach.call(sv.querySelectorAll('button'),function(b){ b.className=(b.getAttribute('data-v')==='student')===!!state.preview?'on':''; });
  var sel=document.getElementById('asStu'); sel.style.display=(!LOCK&&state.preview)?'':'none';
  if(!LOCK){ sel.innerHTML=FULL.students.map(function(s){return '<option'+(s.ad===state.preview?' selected':'')+'>'+esc(s.ad)+'</option>';}).join(''); }
  document.getElementById('segPct').style.display=T()?'':'none';
  Array.prototype.forEach.call(document.querySelectorAll('#segPct button'),function(b){ b.className=(b.getAttribute('data-p')==='1')===state.pctT?'on':''; });
  document.getElementById('refresh').style.display=(T()&&!DATA.readonly)?'':'none';
  document.getElementById('grp').textContent=LOCK?'Şəxsi kabinet':S.list.length+' tələbə · '+S.tests.length+' test';
  document.getElementById('nav').innerHTML=tabs();
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){ b.onclick=function(){ state.tab=b.getAttribute('data-t'); render(); window.scrollTo(0,0); }; });
  var h='';
  if(state.preview) h+='<div class="pv"><span>Önizləmə: <b>'+esc(state.preview)+'</b> öz Gmail-i ilə girəndə məhz bunu görəcək.</span><button class="btn" id="pvx">Müəllim görünüşünə qayıt</button></div>';
  if(V.partial) h+='<div class="warn">Son yenilənmə vaxt limitinə görə yarımçıq qaldı — bir də «Yenilə» bas.</div>';
  if(state.tab==='me') h+=meView();
  else if(state.tab==='overview') h+=overview();
  else if(state.tab==='students') h+=studentsView();
  else if(state.tab==='matrix') h+=matrix();
  else if(state.tab==='alerts') h+=alertsView();
  else if(state.tab==='profile') h+=profileView();
  else if(state.tab==='xat') h+=xatView();
  else if(state.tab==='activity') h+=activityView();
  else h+=unmatchedView();
  if(T()&&V.errors&&V.errors.length) h+='<div class="foot">Oxuna bilməyənlər: '+V.errors.map(esc).join(' · ')+'</div>';
  h+='<div class="foot">Hər saat avtomatik yenilənir · '+fmt(V.updated,true)+'</div>';
  var m=document.getElementById('main'); m.innerHTML=h;
  var q=document.getElementById('q'); if(q){ q.oninput=function(){ state.q=q.value; var pos=q.selectionStart; render(); var n=document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); }; }
  var so=document.getElementById('sort'); if(so){ so.onchange=function(){ state.sort=so.value; render(); }; }
  Array.prototype.forEach.call(m.querySelectorAll('[data-s]'),function(el){ el.onclick=function(ev){ ev.stopPropagation(); openStudent(el.getAttribute('data-s')); }; });
  Array.prototype.forEach.call(m.querySelectorAll('[data-lb]'),function(b){ b.onclick=function(ev){ ev.stopPropagation(); state.lb=b.getAttribute('data-lb'); render(); }; });
  Array.prototype.forEach.call(m.querySelectorAll('[data-ap]'),function(b){ b.onclick=function(ev){ ev.stopPropagation(); state.actP=b.getAttribute('data-ap'); render(); }; });
  Array.prototype.forEach.call(m.querySelectorAll('[data-ak]'),function(b){ b.onclick=function(ev){ ev.stopPropagation(); state.actK=b.getAttribute('data-ak'); render(); }; });
  var px=document.getElementById('pvx'); if(px) px.onclick=function(){ state.preview=null; state.tab='overview'; render(); };
  bindTips(m);
}
Array.prototype.forEach.call(document.querySelectorAll('#segView button'),function(b){ b.onclick=function(){ if(b.getAttribute('data-v')==='student'){ if(!state.preview){ state.preview=FULL.students[0]&&FULL.students[0].ad; state.tab='me'; } } else { state.preview=null; state.tab='overview'; } render(); }; });
document.getElementById('asStu').onchange=function(){ state.preview=this.value; state.tab='me'; render(); };
Array.prototype.forEach.call(document.querySelectorAll('#segPct button'),function(b){ b.onclick=function(){ state.pctT=b.getAttribute('data-p')==='1'; save('pmpPT',state.pctT?'1':'0'); render(); }; });
document.getElementById('refresh').onclick=function(){
  var b=this; if(typeof google==='undefined'||!google.script){ alert('Yalnız Google-da işləyir (bu, nümunə səhifədir).'); return; }
  b.disabled=true; b.textContent='Yenilənir…';
  google.script.run.withSuccessHandler(function(d){ DATA=FULL=d; VDc=null; b.disabled=false; b.textContent='Yenilə'; render(); })
    .withFailureHandler(function(e){ b.disabled=false; b.textContent='Yenilə'; alert('Xəta: '+e.message); }).yenileVeQaytar();
};
render();
